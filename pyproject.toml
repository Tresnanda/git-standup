[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "git-standup"
version = "0.1.0"
description = "AI-powered weekly standup generator from git log"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "git-standup contributors" }]
keywords = ["git", "standup", "changelog", "release-notes", "cli", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Version Control :: Git",
    "Topic :: Utilities",
]

dependencies = [
    "httpx>=0.27",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "pip-audit>=2.7",
    "pytest>=8.0",
    "ruff>=0.4.0",
    "twine>=5.0",
]

[project.scripts]
git-standup = "git_standup.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-v --tb=short"
testpaths = ["tests"]
