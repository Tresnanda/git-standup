[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "git-standup"
version = "0.1.0"
description = "AI-powered weekly standup generator from git log"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Vibe Coder" }]

dependencies = [
    "gitpython>=3.1",
    "httpx>=0.27",
    "rich>=13.0",
]

[project.scripts]
git-standup = "git_standup.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
